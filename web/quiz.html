ntinue listening if needed.',loading:'Loading…'}};
const BOOKS=[{"id": "ushqan-uya", "title": {"kk": "Ұшқан ұя", "ru": "Наша семья", "en": "Our Family"}}, {"id": "urker", "title": {"kk": "Үркер", "ru": "Плеяды", "en": "The Pleiades"}}, {"id": "zhar-zhagalagan", "title": {"kk": "Жар жағалаған жалғыз", "ru": "Над пропастью во ржи", "en": "The Catcher in the Rye"}}, {"id": "qorgansyzdyn-kuni", "title": {"kk": "Қорғансыздың күні", "ru": "Судьба беззащитной", "en": "The Fate of the Defenseless"}}, {"id": "alansyz-omir", "title": {"kk": "Алаңсыз өмір сүру құпиясы", "ru": "Как перестать беспокоиться и начать жить", "en": "How to Stop Worrying and Start Living"}}, {"id": "gauhartas", "title": {"kk": "Гауһартас", "ru": "Гаухартас", "en": "Gauhartas"}}, {"id": "saqina-bauyrlastygy", "title": {"kk": "Сақиналар әміршісі: сақина бауырластығы", "ru": "Властелин колец: Братство кольца", "en": "The Lord of the Rings: The Fellowship of the Ring"}}, {"id": "shuganyn-belgisi", "title": {"kk": "Шұғаның белгісі", "ru": "Памятник Шуги", "en": "Shuga’s Monument"}}, {"id": "tuysiginmen-oyla", "title": {"kk": "Түйсігіңмен ойлай біл", "ru": "Подсознание может всё!", "en": "Mind Power into the 21st Century"}}, {"id": "ikigai", "title": {"kk": "Икигай", "ru": "Икигай", "en": "The Little Book of Ikigai"}}, {"id": "maqsatyma-zhetemin", "title": {"kk": "Мақсатыма жетемін", "ru": "Я достигну своей цели", "en": "I Will Achieve My Goal"}}, {"id": "zheti-dagdy", "title": {"kk": "Жоғары нәтижелі адамдардың 7 дағдысы", "ru": "7 навыков высокоэффективных людей", "en": "The 7 Habits of Highly Effective People"}}, {"id": "abai-qara-soz", "title": {"kk": "Абайдың қара сөздері", "ru": "Слова назидания Абая", "en": "Abai’s Book of Words"}}, {"id": "ayaq-kiim-satushy", "title": {"kk": "Аяқ киім сатушы", "ru": "Продавец обуви", "en": "Shoe Dog"}}];const params=new URLSearchParams(location.search);let lang=params.get('lang')||localStorage.getItem('library-lang')||'kk';if(!T[lang])lang='kk';let account=null,p=null,book=null,result=null,answers=[null,null,null,null],busy=false;const id=params.get('book'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');async function api(url,opts){const r=await fetch(url,opts);const data=await r.json();if(!r.ok){if(data.code==='book_blocked')location.href='/blocked.html';throw Error('request')}return data}
function progress(){if(!p)return;const t=T[lang];document.getElementById('progress').innerHTML=`<section class="progress"><div class="row"><strong>${p.total} / 240 ${t.points}</strong><span>${p.unlocked?t.unlocked:t.remain+': '+Math.max(0,240-p.total)}</span></div><progress value="${Math.min(p.total,240)}" max="240" aria-label="${esc(t.goal)}"></progress><p>${t.goal}</p>${p.unlocked?`<a class="button reward" href="/reward">${t.open}</a>`:''}<p class="small">${t.save}</p></section>`;}
function render(){const t=T[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});progress();if(!p){app.textContent=t.loading;return}if(!book){app.innerHTML=`<h1>${t.title}</h1><p>${t.rules}</p><div class="list">${BOOKS.map(b=>`<a class="item" href="/quiz.html?book=${b.id}&lang=${lang}"><strong>${esc(b.title[lang])}</strong>${t.best}: ${p.scores[b.id]||0} / 20</a>`).join('')}</div>`;return}if(!account?.profile){const text={kk:'Ұпай жинау үшін профиль жасаңыз.',ru:'Создайте профиль, чтобы проходить тесты и сохранять очки.',en:'Create a profile to take quizzes and save your points.'};app.innerHTML=`<section class="panel"><p>${text[lang]}</p><a class="button" target="_top" href="/profile.html">${{kk:'Профиль жасау',ru:'Создать профиль',en:'Create profile'}[lang]}</a></section>`;return}const head=`<h1>${esc(book.title[lang])}</h1><p>${t.rules}</p><p class="small">${t.hint}</p>`;if(result){app.innerHTML=head+`<section class="panel"><h2>${t.result}: ${result.score} / 20</h2><p>${t.saved}. ${t.best}: ${p.scores[book.id]} / 20</p>${book.questions.map((q,i)=>`<div class="${result.correct[i]?'correct':'incorrect'}"><strong>${i+1}. ${esc(q.q[lang])}</strong><p>${result.correct[i]?t.yes:t.no}. ${t.correct}: ${esc(q.options[result.answers[i]][lang])}</p></div>`).join('')}<div class="actions"><button id="retry">${t.retry}</button><a class="button" href="/quiz.html?lang=${lang}">${t.all}</a><a class="button" href="${book.url}">${t.video}</a></div></section>`;document.getElementById('retry').onclick=()=>{result=null;answers=[null,null,null,null];render()};return}app.innerHTML=head+`<form id="quiz">${book.questions.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q.q[lang])}</legend>${q.options.map((o,j)=>`<label class="choice"><input required type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}><span>${esc(o[lang])}</span></label>`).join('')}</fieldset>`).join('')}<div id="error" role="alert"></div><button type="submit" ${busy?'disabled':''}>${busy?t.working:t.test}</button></form><div class="actions"><a href="${book.url}">${t.video}</a><a href="/quiz.html?lang=${lang}">${t.all}</a></div>`;document.getElementById('quiz').onchange=e=>{answers[Number(e.target.name.slice(1))]=Number(e.target.value)};document.getElementById('quiz').onsubmit=async e=>{e.preventDefault();if(busy||answers.some(a=>a===null))return;busy=true;render();try{const r=await api('/api/quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book:book.id,answers})});result=r;p=r;busy=false;render();window.checkLibraryUnlock?.(r);app.scrollIntoView({behavior:'smooth',block:'start'})}catch{busy=false;render();document.getElementById('error').innerHTML=`<p class="error">${t.error}</p>`}};}
async function init(){try{account=await api('/api/account');p=await api('/api/progress');if(id)book=await api('/api/quiz?book='+encodeURIComponent(id));render()}catch{app.innerHTML=`<p class="error">${T[lang].error}</p><button id="reload">${T[lang].again}</button>`;document.getElementById('reload').onclick=init}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(busy)return;lang=b.dataset.lang;localStorage.setItem('library-lang',lang);render()});render();init();
